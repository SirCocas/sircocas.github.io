<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <a href="/"{% if page.url == "/" %} class="active"{% endif %}>Curriculum Vitae</a>
    <a href="/opinion.html"{% if page.url contains "opinion" %} class="active"{% endif %}>Opinion Essays</a>
  </nav>
  <main class="cv-content">
    {{ content }}
  </main>
</body>
</html>
